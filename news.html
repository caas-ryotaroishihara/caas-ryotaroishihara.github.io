<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>news — 遼太郎</title>
  <style>
    body {
      font-family: Georgia, serif;
      font-size: 15px;
      line-height: 1.6;
      margin: 40px;
      background: white;
      color: black;
    }
    h1 { font-size: 15px; font-weight: normal; margin: 0 0 8px 0; }
    nav { margin-bottom: 40px; }
    nav a { color: black; text-decoration: underline; margin-right: 16px; }
    .news-item { margin-bottom: 24px; }
    .news-date { color: #555; font-size: 13px; }
    .news-title { margin: 2px 0 4px 0; }
    .news-body { max-width: 560px; }
    .news-body p { margin: 0 0 8px 0; }
  </style>
</head>
<body>

  <h1>遼太郎 / Ryōtarō</h1>
  <nav>
    <a href="index.html">home</a>
    <a href="about.html">about</a>
    <a href="news.html">news</a>
    <a href="works.html">works</a>
  </nav>

  <p>news</p>

  <div id="news-list">読み込み中…</div>

  <!-- ニュースの Markdown を読み込んで表示する処理 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // CMS で追加した記事のファイル名をここに新しい順で並べます。
    // （CMSから追加したら、この配列に1行足すだけ）
    const posts = [
      "2026-05-01-site-open.md"
    ];

    async function loadNews() {
      const container = document.getElementById("news-list");
      container.innerHTML = "";
      for (const file of posts) {
        try {
          const res = await fetch("news/_posts/" + file);
          const text = await res.text();
          // フロントマター（--- で囲まれた部分）を分離
          const match = text.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);
          let date = "", title = "", body = text;
          if (match) {
            const fm = match[1];
            body = match[2];
            const dm = fm.match(/date:\s*(.+)/);
            const tm = fm.match(/title:\s*(.+)/);
            if (dm) date = dm[1].trim();
            if (tm) title = tm[1].trim().replace(/^["']|["']$/g, "");
          }
          const div = document.createElement("div");
          div.className = "news-item";
          div.innerHTML =
            '<div class="news-date">' + date + '</div>' +
            '<div class="news-title">' + title + '</div>' +
            '<div class="news-body">' + marked.parse(body) + '</div>';
          container.appendChild(div);
        } catch (e) {
          console.error("読み込み失敗:", file, e);
        }
      }
      if (!container.innerHTML) container.innerHTML = "まだ投稿がありません。";
    }
    loadNews();
  </script>

</body>
</html>
