    :root {

    * { box-sizing: border-box; }
    body {

    .page-label { font-size: 0.85rem; color: var(--muted); margin: 0 0 1rem 0; }
    .section-label { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.6rem 0; }
    .news-item { margin-bottom: 0.8rem; }
    .news-date, .event-date, .text-date { color: var(--muted); font-size: 0.8rem; }
    .group-label { font-size: 0.9rem; margin: 1.6rem 0 0.4rem 0; padding-bottom: 0.2rem; border-bottom: 1px solid var(--line); }
    .group-label:first-of-type { margin-top: 0; }
    .year { font-size: 0.85rem; color: var(--muted); margin: 0.9rem 0 0.2rem 0; }
    ul { list-style: none; padding: 0; margin: 0 0 0.5rem 0; }
    ul li { margin-bottom: 0.25rem; }
    ul li a { color: var(--ink); }
    .tag { color: var(--muted); font-size: 0.75rem; font-style: italic; margin-left: 0.4rem; }
    .event, .text-item { margin-bottom: 0.8rem; }
    .note { color: var(--muted); font-size: 0.8rem; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.75rem; }
