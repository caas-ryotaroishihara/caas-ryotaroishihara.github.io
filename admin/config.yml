# === Decap CMS 設定ファイル ===
# backend: GitHub と接続する設定。ステップ5の認証設定後に有効になります。
backend:
  name: git-gateway
  branch: main

# アップロードした画像の保存先
media_folder: "images/uploads"
public_folder: "/images/uploads"

# 編集言語を日本語に
locale: "ja"

# === 編集できるコンテンツの種類 ===
collections:
  # --- ニュース ---
  - name: "news"
    label: "ニュース"
    label_singular: "ニュース"
    folder: "news/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "本文", name: "body", widget: "markdown" }

  # --- 作品 ---
  - name: "works"
    label: "作品"
    label_singular: "作品"
    folder: "works/_items"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "作品名", name: "title", widget: "string" }
      - { label: "制作年", name: "year", widget: "string" }
      - { label: "編成・長さ", name: "instrumentation", widget: "string", required: false }
      - { label: "解説", name: "body", widget: "markdown", required: false }
      - { label: "楽譜・資料 (PDF等のリンク)", name: "score_url", widget: "string", required: false }
      - { label: "音源・映像 (リンク)", name: "media_url", widget: "string", required: false }
